name: batch-fetch-prices

on:
    # Hourly tick; each watch's check_frequency_minutes decides whether it is due, so
    # GitHub's 5–15 min cron jitter cannot push a 6-hour watch out to 12 hours.
    # The cron day/month range is coarse (UTC, and it recurs every year); the `gate`
    # job enforces the exact end time below. Manual runs are never gated.
    schedule:
        - cron: "0 * 6-11 10 *"
    workflow_dispatch:
        inputs:
            log_level:
                description: "Log level for this run"
                required: false
                default: "INFO"
                type: choice
                options: [DEBUG, INFO, WARNING, ERROR]

concurrency:
    group: batch-fetch-prices
    cancel-in-progress: false

env:
    # Scheduled runs stop after this instant: 2026-10-11 23:59:59 Asia/Ho_Chi_Minh.
    SCHEDULE_END_UTC: "2026-10-11T16:59:59Z"

jobs:
    gate:
        runs-on: ubuntu-latest
        timeout-minutes: 2
        outputs:
            run: ${{ steps.check.outputs.run }}
        steps:
            - name: Check schedule window
              id: check
              env:
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  if [ "$EVENT_NAME" != "schedule" ]; then
                      echo "run=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  now=$(date -u +%s)
                  end=$(date -u -d "$SCHEDULE_END_UTC" +%s)
                  if [ "$now" -le "$end" ]; then
                      echo "run=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "::notice::Schedule window ended at $SCHEDULE_END_UTC; skipping batch."
                      echo "run=false" >> "$GITHUB_OUTPUT"
                  fi

    fetch:
        needs: gate
        if: needs.gate.outputs.run == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # Secrets/variables come from the `prod` GitHub Environment, managed by
        # `make github-env-push STAGE=prod` (see docs/deployment/setup.md).
        environment: prod

        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
            APP_ENV: ${{ vars.APP_ENV || 'production' }}
            LOG_LEVEL: ${{ inputs.log_level || vars.LOG_LEVEL || 'INFO' }}
            PYTHONUNBUFFERED: "1"

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Setup Python
              run: uv python install 3.12

            - name: Sync dependencies
              run: uv sync --frozen

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-chromium-${{ runner.os }}-${{ hashFiles('uv.lock') }}

            - name: Install Playwright Chromium
              run: |
                  if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
                      uv run playwright install-deps chromium
                  else
                      uv run playwright install --with-deps chromium
                  fi

            - name: Run batch fetch
              run: uv run python -m travel_data_platform.workers.batch_fetch_prices

            - name: Upload debug artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: debug-${{ github.run_id }}-${{ github.run_attempt }}
                  path: debug/
                  if-no-files-found: ignore
                  retention-days: 7
